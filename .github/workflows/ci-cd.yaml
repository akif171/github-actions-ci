name: Github Actions Demo
run-name: ${{ github.actor }} is testing out Github Actions
on: 
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build-deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: Print Trigger Namme
        run: echo "Trigger name ${{ github.event_name }}"

      - name: Checkout the Repository
        uses: actions/checkout@v7
        
      - name: List Repo Files
        run: ls

      - name: Setup Nodejs
        uses: actions/setup-node@v7
        with:
          node-version: '22.4.0'

      - name: Run the App
        run: npm start

      - name: Smoke Test the App
        run: |
          curl http://localhost:3000/health
    
      - name: Push to DockerHub
        run: echo "pushing the image to docker hub."

      - name: Deploy
        run: echo "Deploy the app on kubernetes."

        